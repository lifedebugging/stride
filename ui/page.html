<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stride Palette Sandbox</title>
    <style>
        /* FULL PAGE BACKGROUND */
        body {
            background-color: #808836;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* MAIN CHAT CONTAINER BOX */
        .chat-box {
            background-color:#1F3323;
            width: 480px;
            padding: 24px;
            border-radius: 6px;
            /* Coral bottom border highlight */
            border-bottom: 4px solid #F2765E;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* METADATA ROUTER TAG */
        .tag {
            background-color: #CA8787;
            color: #ffffff;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* CHAT BUBBLE */
        .bubble {
            background-color: rgba(255, 255, 255, 0.07);
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #9564DD;
            font-size: 14px;
            line-height: 1.4;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            color: #fff;
            border-radius: 4px;
            font-family: monospace;
            outline: none;
        }

        button {
            background-color: #F2765E;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-family: monospace;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="chat-box">
        <div class="header">STRIDE // CHAT</div>
        <div class="tag">Keyword Router: 88% Match</div>

        <div class="bubble">
            <strong>Stride:</strong> Palette preview ready. High precision route active.
        </div>

        <div class="input-row">
            <input type="text" placeholder="Type query..." />
            <button>Send</button>
        </div>
    </div>

</body>

</html>
